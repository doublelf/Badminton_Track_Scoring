# Configuration for the badminton tracking pipeline.
# Every value can be overridden from the command line with --config.

camera:
  width: 0
  height: 0
  fps: 0

court:
  length: 13.4
  width: 6.1
  singles_margin: 0.46
  service_line_from_net: 1.98
  back_service_offset: 0.76
  # tolerance used when deciding whether a landing was inside the court
  in_out_margin_m: 0.02

player:
  model: weights/yolo11n.pt
  imgsz: 640
  conf: 0.35
  iou: 0.5
  every_n_frames: 2
  tracker: bytetrack.yaml

ball:
  model: weights/yolo11s-ball.pt
  imgsz: 640
  conf: 0.18
  iou: 0.45
  every_n_frames: 1
  max_box_area_ratio: 0.004
  max_aspect_ratio: 4.0
  max_jump_pixels: 220
  prediction_gate_pixels: 260
  max_missing_frames: 5
  roi_padding_ratio: 0.08
  # the shuttlecock flies above the court, so the court ROI must NOT gate it
  use_roi: false

pose:
  enabled: false
  model: weights/yolo11n-pose.pt
  imgsz: 640
  conf: 0.3
  every_n_frames: 3

events:
  fps_reference: 30.0
  min_visible_before: 3
  merge_window: 3
  hit:
    min_speed_at_hit: 3.0
    vy_reversal_threshold: 1.0
    vx_reversal_threshold: 1.0
    acc_threshold: 3.0
    min_height_diff: 5.0
    min_peak_speed: 10.0
    min_speed_diff: 2.0
  landing:
    speed_drop_ratio: 0.3
    min_speed_before_landing: 8.0
    max_speed_after_landing: 5.0
    high_speed_threshold: 8.0
    low_speed_threshold: 2.5
    low_speed_ratio: 0.7
    hold_window: 3
    pre_window: 2
    post_window: 4
    future_check_window: 5
    edge_margin: 20
    # --- landing plausibility ---
    max_landing_speed: 12.0      # above this the ball is still flying
    max_ascent_velocity: -3.0    # below this the ball is still going up (lob apex)
    max_descent_velocity: 2.0    # above this the ball starts falling again
    settle_window: 25            # frames searched for the resting position
    settle_speed: 1.5            # speed under which the ball counts as resting
    min_settle_frames: 6
  attribution:
    racket_reach_m: 1.6
    hit_window_offsets: [0, 3, 5]
    min_attribution_confidence: 0.25

scoring:
  mode: singles
  points_to_win: 21
  win_by: 2
  point_cap: 30
  games_to_win: 2
  switch_ends_at: 10
  switch_ends_at_third_game: 11
  team_a_name: "A"
  team_b_name: "B"

trail:
  length: 30
  fade: true
  color_by_speed: true
  min_point_distance: 1.5

render:
  hud: true
  minimap: true
  minimap_size: 300
  show_fps: true
  show_debug: false
  write_video: true
  video_fps: 0
